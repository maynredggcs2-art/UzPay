<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>UzPay</title>
<style>
:root{--bg:#05070d;--card:#10151f;--line:#232b3a;--txt:#fff;--mut:#8b97ab;--acc:#1f73c9;--acc2:#5aa9ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#0e2340 0,transparent 55%),var(--bg);padding:0 16px 40px;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;height:56px;font-weight:700;font-size:20px}
.top .r{display:flex;align-items:center;gap:2px}
.icon-btn{background:none;border:0;color:#fff;font-size:22px;padding:8px;cursor:pointer}
.lg{background:#14233a;border:1px solid var(--line);color:#fff;border-radius:14px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#101826;color:#fff;font-size:20px;cursor:pointer;margin:8px 0}
h1{font-size:30px;margin:12px 0 18px;display:flex;align-items:center;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lbl{letter-spacing:4px;font-size:13px;font-weight:700;color:var(--acc2)}
.pill{background:#14233a;border:0;color:#fff;font-weight:600;padding:10px 20px;border-radius:20px;cursor:pointer;font-size:15px}
.pill.on{background:var(--acc)}
input.inp{width:100%;background:#131b29;border:1px solid var(--line);color:#fff;border-radius:22px;padding:16px 18px;font-size:16px;outline:none}
input.inp:focus{border-color:var(--acc)}
.hero{text-align:center;font-size:48px;margin:20px 0 0}
.orbit{position:relative;height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.orbit:before{content:"";position:absolute;inset:10px 0;border:1px solid #1c2638;border-radius:50%;transform:rotate(-10deg)}
.num{font-size:96px;font-weight:800;line-height:1;background:linear-gradient(#fff,#8fc3f5);-webkit-background-clip:text;color:transparent}
.unit{letter-spacing:6px;color:var(--acc2);font-weight:700;margin-top:8px;text-transform:uppercase}
.rb{position:absolute;top:50%;transform:translateY(-50%);width:70px;height:70px;border-radius:50%;border:1px solid var(--line);background:#0b111b;color:#fff;font-size:30px;cursor:pointer}
.rb.l{left:0}.rb.r{right:0}
.price{text-align:center;font-size:34px;font-weight:700;margin:6px 0 20px}
.price s{font-size:18px;color:var(--mut);margin-left:8px;font-weight:500}
.price small{font-size:17px;color:var(--mut);font-weight:500;margin-left:6px}
.badge{display:inline-block;background:var(--acc);font-size:14px;padding:4px 10px;border-radius:8px;vertical-align:middle;margin-left:6px}
.plans{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:22px}
.plan{position:relative;width:calc(33.3% - 8px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 4px 14px;text-align:center;cursor:pointer}
.plan.sel{border-color:var(--acc2);background:#112137}
.plan b{display:block;font-size:22px}.plan span{color:var(--mut);font-size:17px}
.plan i{position:absolute;top:-12px;right:12px;background:var(--acc);font-style:normal;font-size:13px;font-weight:700;padding:3px 9px;border-radius:8px}
.plan i.adm{background:#2b3446;color:#cfd8e6}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chip{flex:1 0 calc(20% - 10px);min-width:60px;background:var(--card);border:1px solid var(--line);color:#fff;padding:16px 0;border-radius:30px;font-size:19px;font-weight:600;cursor:pointer}
.chip.sel{background:var(--acc);border-color:var(--acc)}
.gifts{display:flex;gap:12px;overflow-x:auto;padding:4px 0 18px;margin-bottom:10px}
.gift{flex:0 0 120px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 6px 12px;text-align:center;cursor:pointer}
.gift.sel{border-color:var(--acc2);background:#112137}
.gift .e{font-size:54px}.gift s{display:block;color:var(--mut);margin-top:10px;font-size:15px}.gift b{font-size:17px}
.giftbox{width:260px;height:260px;border-radius:50%;background:#16233a;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:90px;margin:20px auto 10px}
.pay{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:12px;gap:6px;margin-bottom:22px}
.pm{border:0;background:none;color:#fff;font-size:19px;font-weight:600;padding:18px 8px;border-radius:20px;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:center}
.pm.sel{background:#2f3036}.pm small{display:block;color:#ff6b6b;font-size:15px;text-align:left}
.pm small.ok{color:#5fd68a}
.pm .ic{font-size:24px}
.buy{width:100%;background:var(--acc);border:0;color:#fff;font-size:21px;font-weight:700;padding:22px;border-radius:40px;cursor:pointer}
.buy:disabled{opacity:.5}
.menu{display:grid;gap:14px;margin-top:16px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;align-items:center;gap:18px;font-size:22px;font-weight:700;cursor:pointer}
.mcard span.e{font-size:38px}.mcard small{display:block;color:var(--mut);font-size:14px;font-weight:500;margin-top:4px}
.hello{font-size:15px;color:var(--mut);margin-top:6px}
.hello b{color:#fff;font-size:24px;display:block;margin-top:2px}
.balcard{margin-top:16px;background:linear-gradient(135deg,#1c5fae,#1b3b6b 60%,#162a4a);border-radius:26px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border:1px solid #2d6bb4;position:relative;overflow:hidden}
.balcard:after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;border:1px solid #ffffff22}
.balcard small{color:#cfe3fa;font-size:13px;letter-spacing:2px;text-transform:uppercase}
.balcard b{display:block;font-size:30px;margin-top:4px}
.balcard .tp{background:#ffffff22;border:0;color:#fff;font-weight:700;padding:12px 18px;border-radius:18px;font-size:15px;cursor:pointer;z-index:1}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:480px;background:#0d1320;border-radius:28px 28px 0 0;padding:22px 18px 30px;max-height:94vh;overflow:auto}
.sheet h2{margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.pay-sheet{background:linear-gradient(180deg,#223552,#121b2c)}
.grab{width:70px;height:5px;border-radius:5px;background:#0006;margin:-8px auto 18px}
.timer{color:#4fd3f0;font-size:24px;font-variant-numeric:tabular-nums}
.paycard{background:linear-gradient(135deg,#1c63b5,#1a8bd0 60%,#1b5fa8);border:1px solid #6fc3f0aa;border-radius:28px;padding:24px;position:relative;overflow:hidden;margin-bottom:16px}
.paycard:after{content:"";position:absolute;right:-90px;top:-20px;width:300px;height:300px;border-radius:50%;border:1px solid #ffffff33}
.pc-brand{letter-spacing:3px;font-weight:800;font-size:14px;text-transform:uppercase}
.pc-sum{font-size:50px;font-weight:800;margin:14px 0 22px}.pc-sum small{font-size:20px;color:#bfe6ff}
.pc-num{font-size:26px;font-weight:800;letter-spacing:1px}
.pc-holder{font-size:14px;font-weight:700;margin-top:6px;text-transform:uppercase;color:#e3f3ff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.cp{background:#ffffff1a;border:1px solid #ffffff2e;color:#fff;border-radius:22px;padding:18px;font-size:18px;font-weight:700;cursor:pointer}
.paid{width:100%;background:#f1e4d3;color:#2a3342;border:0;border-radius:40px;padding:26px;font-size:21px;font-weight:700;cursor:pointer}
.paid:disabled{opacity:.45}
.cancel{display:block;width:100%;background:none;border:0;color:#d8e3f2;font-size:18px;font-weight:700;padding:18px;cursor:pointer}
.warn{background:#3a1f22;border:1px solid #7a3338;color:#ffb4b4;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px}
.tab{background:var(--card);border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:18px;white-space:nowrap;cursor:pointer;font-size:14px}
.tab.sel{background:var(--acc)}
.f{margin-bottom:12px}.f label{display:block;color:var(--mut);font-size:13px;margin-bottom:6px}
.f input[type=text],.f input[type=number],.f input[type=password],.f input[type=color]{width:100%;background:#131b29;border:1px solid var(--line);color:#fff;border-radius:14px;padding:12px;font-size:15px}
.f input[type=color]{height:44px;padding:4px}
.er{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;margin-bottom:8px}
.er input{width:100%;background:#131b29;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px;font-size:14px;min-width:0}
.btn{background:var(--acc);border:0;color:#fff;border-radius:14px;padding:12px 18px;font-weight:600;cursor:pointer;font-size:15px}
.btn.red{background:#b3372f}.btn.gray{background:#2b3446}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ord{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;font-size:14px;line-height:1.5}
.st{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:700;background:#2b3446}
.st.done{background:#17653a}.st.canceled{background:#7a2b2b}.st.pending{background:#7a5a17}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1d2a40;border:1px solid var(--line);padding:14px 22px;border-radius:16px;z-index:60;max-width:90%;text-align:center}
.maint{text-align:center;padding:120px 20px;font-size:22px}
.section{color:var(--mut);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin:22px 0 10px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 4px;text-align:center}
.langbar{position:absolute;top:16px;right:16px;display:flex;gap:6px}
.logo{font-size:84px;margin:0 auto}
.login h1{justify-content:center;font-size:46px;margin:8px 0 6px;letter-spacing:1px;background:linear-gradient(90deg,#fff,#7cc0ff,#fff);background-size:200% 100%;-webkit-background-clip:text;color:transparent}
.login p{color:var(--mut);margin:0 0 30px;font-size:16px}
.lcard{background:#0e1522cc;border:1px solid var(--line);border-radius:30px;padding:22px;display:grid;gap:12px;backdrop-filter:blur(8px);text-align:left}
.lcard label{font-size:12px;letter-spacing:3px;color:var(--acc2);font-weight:700}
.lnote{font-size:12px;color:var(--mut);margin-top:16px}
/* profile */
.avatar{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,#2b86e0,#6a5bd8);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;margin:14px auto 10px;box-shadow:0 0 30px #3d8fe466}
.pname{text-align:center;font-size:24px;font-weight:800}.puser{text-align:center;color:var(--acc2);margin-bottom:6px}
.langrow{display:flex;gap:10px}.langrow .pill{flex:1}

/* ================= ANIMATIONS ================= */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 10px #2b7cd4)}50%{filter:drop-shadow(0 0 28px #5aa9ee)}}
@keyframes orbitMove{to{offset-distance:100%}}
@keyframes pop{0%{transform:scale(.55);opacity:.2}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes shimmer{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(220%) skewX(-20deg)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes drift{from{background-position:0 0,0 0,0 0}to{background-position:0 -400px,0 -260px,0 -160px}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,30px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 #5aa9ee77}100%{box-shadow:0 0 0 16px #5aa9ee00}}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes gradMove{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes sweep{0%{transform:translateX(-130%) skewX(-20deg)}100%{transform:translateX(330%) skewX(-20deg)}}
@keyframes blink{50%{opacity:.4}}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 140px,#9cd0ff,transparent),radial-gradient(1px 1px at 160px 70px,#fff,transparent);
  background-size:200px 200px,260px 260px,160px 160px;animation:drift 40s linear infinite,twinkle 4s ease-in-out infinite}
.app.enter>*{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both}
.app.enter>*:nth-child(2){animation-delay:.05s}.app.enter>*:nth-child(3){animation-delay:.1s}
.app.enter>*:nth-child(4){animation-delay:.15s}.app.enter>*:nth-child(5){animation-delay:.2s}
.app.enter>*:nth-child(6){animation-delay:.25s}.app.enter>*:nth-child(7){animation-delay:.3s}
.app.enter>*:nth-child(8){animation-delay:.35s}.app.enter>*:nth-child(9){animation-delay:.4s}
.app.enter .mcard,.app.enter .balcard{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}
.app.enter .mcard:nth-child(1){animation-delay:.1s}.app.enter .mcard:nth-child(2){animation-delay:.22s}.app.enter .mcard:nth-child(3){animation-delay:.34s}
.app.enter .plan,.app.enter .chip,.app.enter .gift{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.app.enter .plan:nth-child(2),.app.enter .chip:nth-child(2),.app.enter .gift:nth-child(2){animation-delay:.07s}
.app.enter .plan:nth-child(3),.app.enter .chip:nth-child(3),.app.enter .gift:nth-child(3){animation-delay:.14s}
.app.enter .plan:nth-child(4),.app.enter .chip:nth-child(4),.app.enter .gift:nth-child(4){animation-delay:.21s}
.app.enter .plan:nth-child(5),.app.enter .chip:nth-child(5),.app.enter .gift:nth-child(5){animation-delay:.28s}
.app.enter .chip:nth-child(n+6){animation-delay:.35s}
.hero,.logo{animation:floaty 4s ease-in-out infinite,glow 3s ease-in-out infinite}
.logo{display:inline-block}
.giftbox{animation:floaty 5s ease-in-out infinite,glow 3s ease-in-out infinite}
.orbit:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#9cd0ff;box-shadow:0 0 14px 4px #5aa9ee;offset-path:ellipse(46% 44% at 50% 50%);offset-rotate:0deg;animation:orbitMove 7s linear infinite}
.num{display:inline-block;filter:drop-shadow(0 0 18px #3d8fe488)}
.num.pop,.giftbox.pop,.price.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
.login h1{animation:gradMove 5s linear infinite}
.lcard{animation:fadeUp .7s .15s cubic-bezier(.2,.8,.2,1) both}
.mcard,.plan,.gift,.chip,.pm,.pill,.rb,.back,.tab,.btn,.buy,.cp,.paid,.lg,.balcard{transition:transform .18s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s,box-shadow .25s;position:relative}
.mcard:hover{transform:translateY(-4px);border-color:var(--acc2);box-shadow:0 12px 30px #1f73c933}
.mcard:active,.plan:active,.gift:active,.chip:active,.pm:active,.pill:active,.back:active,.tab:active,.btn:active,.cp:active,.paid:active,.lg:active,.balcard:active{transform:scale(.95)}
.mcard span.e{display:inline-block;transition:transform .4s}.mcard:hover span.e{transform:scale(1.25) rotate(-10deg)}
.plan:hover,.gift:hover,.chip:hover{transform:translateY(-3px);border-color:#3a6ea8}
.plan.sel,.gift.sel{box-shadow:0 0 22px #3d8fe455;animation:ring 1.6s ease-out infinite}
.chip.sel{box-shadow:0 0 18px #3d8fe477}
.rb:hover{background:#15233a;border-color:var(--acc2);box-shadow:0 0 20px #3d8fe466}
.rb:active{transform:translateY(-50%) scale(.88)}
.orbit .rb{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;user-select:none}
.orbit:before,.orbit:after{pointer-events:none}
button{touch-action:manipulation}
.num,.unit{user-select:none;pointer-events:none}
.pm .ic{transition:transform .3s}.pm:hover .ic{transform:scale(1.2) rotate(-8deg)}
.buy{overflow:hidden;background:linear-gradient(90deg,var(--acc),#3d9bf0,var(--acc));background-size:200% 100%;animation:gradMove 4s linear infinite;box-shadow:0 8px 28px #1f73c955}
.buy:before{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,#ffffff55,transparent);animation:shimmer 3.2s infinite}
.buy:hover{transform:translateY(-2px)}.buy:active{transform:scale(.97)}
input.inp{transition:border-color .25s,box-shadow .25s,transform .25s}
input.inp:focus{box-shadow:0 0 0 4px #1f73c933;transform:scale(1.01)}
input.inp.err{animation:shake .4s;border-color:#e5484d}
.paycard:before{content:"";position:absolute;top:0;left:0;width:30%;height:100%;background:linear-gradient(90deg,transparent,#ffffff30,transparent);animation:sweep 4s ease-in-out infinite}
.timer.low{color:#ff7a7a;animation:blink 1s infinite}
.modal{animation:fadeIn .25s both;backdrop-filter:blur(6px)}
.sheet{animation:slideUp .4s cubic-bezier(.2,.9,.3,1) both}
.toast{animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2) both}
.rip{position:absolute;border-radius:50%;background:#ffffff55;width:40px;height:40px;margin:-20px 0 0 -20px;pointer-events:none;animation:ripple .6s ease-out forwards}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:70;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

let lang=localStorage.getItem(LKEY)||"uz"; if(!L[lang]) lang="uz";

function nextLang(){ const a=["uz","ru","en"]; setLang(a[(a.indexOf(lang)+1)%3]); }

/* ---------------- data ---------------- */
const DEFAULT={
 name:"UzPay",accent:"#1f73c9",maintenance:false,timer:5,webhook:"",
 premium:[{m:1,price:45000,old:0,badge:"admin"},{m:3,price:156000,old:170000,badge:"-8%"},{m:6,price:208000,old:0,badge:"-10%"},{m:12,price:377000,old:0,badge:"-6%"},{m:12,price:300000,old:0,badge:"admin"}],
 starPrice:190,starMin:50,starPresets:[50,75,100,250,500,1000,1500,2000,5000,6666],
 gifts:[{e:"🧸",price:2850,old:3000},{e:"💝",price:2850,old:3000},{e:"🌹",price:5000,old:7000},{e:"🎁",price:5000,old:7000},{e:"🎂",price:10000,old:0},{e:"💐",price:10000,old:0}],
 pay:{balans:true,karta:true,click:true,uzumcard:true},
 req:{karta:{number:"",holder:""},click:{number:"",holder:""},uzumcard:{number:"",holder:""}}
};
function loadCfg(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||"{}"); const c=Object.assign(structuredClone(DEFAULT),s);
  c.pay=Object.assign({},DEFAULT.pay,s.pay||{}); c.req=Object.assign({},DEFAULT.req,s.req||{}); return c; }catch(e){ return structuredClone(DEFAULT); } }
let cfg=loadCfg(), orders=JSON.parse(localStorage.getItem(OKEY)||"[]"), user=JSON.parse(localStorage.getItem(UKEY)||"null");
function save(){ localStorage.setItem(KEY,JSON.stringify(cfg)); document.documentElement.style.setProperty("--acc",cfg.accent); }
function saveOrders(){ localStorage.setItem(OKEY,JSON.stringify(orders)); }
function saveUser(){ localStorage.setItem(UKEY,JSON.stringify(user)); }
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtCard=n=>/^[\d\s]+$/.test(n)?n.replace(/\s/g,"").replace(/(\d{4})(?=\d)/g,"$1 "):n;
const $=s=>document.querySelector(s);
function toast(x){ const d=document.createElement("div"); d.className="toast"; d.textContent=x; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
const PM={balans:["👛","Balans"],karta:["💳","Karta"],click:["🔷","Click"],uzumcard:["🟣","UzumCard"]};
const pmName=k=>k==="balans"?t("balance"):k==="karta"?t("card"):PM[k][1];

let view="home", S={pi:1,stars:50,gift:-1,who:"",self:false,pay:"balans"};

/* ---------------- views ---------------- */
function header(back=true){
  return `<div class="top"><button class="icon-btn" style="${back&&view!=='home'?'':'visibility:hidden'}" onclick="go('home')">←</button><span>${esc(cfg.name)}</span>
  <span class="r"><button class="lg" onclick="nextLang()">${lang.toUpperCase()}</button><button class="icon-btn" onclick="go('profile')">👤</button><button class="icon-btn" onclick="openAdminLogin()">⋮</button></span></div>`;
}
function payBlock(){
  const P=Object.keys(PM).filter(k=>cfg.pay[k]);
  if(!P.includes(S.pay)) S.pay=P[0]||"";
  return `<div class="pay">${P.map(k=>`<button class="pm ${S.pay===k?'sel':''}" onclick="S.pay='${k}';render()"><span class="ic">${PM[k][0]}</span>
   <div>${pmName(k)}${k==='balans'?`<small class="${user.balance>0?'ok':''}">${fmt(user.balance)}</small>`:''}</div></button>`).join("")}</div>`;
}
function recipient(){
  return `<div class="row"><span class="lbl">${t("recipient").toUpperCase()}</span><button class="pill ${S.self?'on':''}" onclick="S.self=!S.self;render()">${t("self")}</button></div>
  <input class="inp" id="who" placeholder="${t("userPh")}" value="${S.self?esc(user.username):esc(S.who)}" ${S.self?'readonly':''} oninput="S.who=this.value">`;
}
function loginView(){
  const lb=["uz","ru","en"].map(l=>`<button class="lg" style="${l===lang?'background:var(--acc)':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join("");
  return `<div class="langbar">${lb}</div><div class="login"><div><div class="logo">👑</div></div><h1>${esc(cfg.name)}</h1><p>${t("tagline")}</p>
  <div class="lcard"><div><label>${t("name").toUpperCase()}</label></div><input class="inp" id="ln" autocomplete="name" placeholder="${t("name")}">
  <div><label>${t("username").toUpperCase()}</label></div><input class="inp" id="lu" placeholder="@username" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="buy" style="margin-top:6px" onclick="doLogin()">${t("enter")}</button></div><div class="lnote">🔒 ${t("note")}</div></div>`;
}
function doLogin(){
  const n=$("#ln").value.trim(), u=$("#lu").value.trim().replace(/^@/,"");
  if(n.length<2){ const e=$("#ln"); e.classList.add("err"); e.focus(); return toast(t("badName")); }
  if(!/^[A-Za-z0-9_]{4,32}$/.test(u)){ const e=$("#lu"); e.classList.add("err"); e.focus(); return toast(t("badUser")); }
  user={name:n,username:"@"+u,balance:0}; saveUser(); view="home"; lastView=null; render(); confetti();
}
function render(){
  const a=$("#app");
  if(!user){ a.innerHTML=loginView(); anim(a,"login"); return; }
  if(cfg.maintenance){ a.innerHTML=header()+`<div class="maint">🛠<br><br>${t("maint")}</div>`; anim(a,"maint"); return; }
  notifyDone();
  if(view==="home"){
    a.innerHTML=header()+`<div class="hello">${t("hello")},<b>${esc(user.name)} 👋</b></div>
    <div class="balcard" onclick="go('profile')"><div><small>${t("balanceLbl")}</small><b>${fmt(user.balance)} so'm</b></div><button class="tp" onclick="event.stopPropagation();openTopup()">＋ ${t("topup")}</button></div>
    <div class="menu">
     <div class="mcard" onclick="go('premium')"><span class="e">👑</span><div>${t("premium")}<small>${t("premSub")}</small></div></div>
     <div class="mcard" onclick="go('stars')"><span class="e">⭐</span><div>${t("stars")}<small>${fmt(cfg.starPrice)} ${t("perStar")}</small></div></div>
     <div class="mcard" onclick="go('gift')"><span class="e">🎁</span><div>${t("gift")}<small>${t("giftSub")}</small></div></div></div>`;
  }
  if(view==="premium"){
    const p=cfg.premium[S.pi]||cfg.premium[0];
    a.innerHTML=header()+`<h1>${t("premium")} 👑</h1>${recipient()}<div class="hero">👑</div>
    <div class="orbit"><button class="rb l" onclick="stepP(-1)">−</button><div class="num">${p.m}</div><div class="unit">${t("month")}</div><button class="rb r" onclick="stepP(1)">+</button></div>
    <div class="price">${fmt(p.price)} so'm ${p.old?`<s>${fmt(p.old)}</s><span class="badge">${esc(p.badge)}</span>`:''}</div>
    <div class="plans">${cfg.premium.map((x,i)=>`<div class="plan ${i===S.pi?'sel':''}" onclick="S.pi=${i};render()">${x.badge?`<i class="${x.badge==='admin'?'adm':''}">${esc(x.badge)}</i>`:''}<b>${x.m} ${t("month")}</b><span>${fmt(x.price)}</span></div>`).join("")}</div>
    ${payBlock()}<button class="buy" onclick="buy('Premium ${p.m} ${t("month")}',${p.price})">${t("buyPremium")} · ${fmt(p.price)} so'm</button>`;
  }
  if(view==="stars"){
    const sum=S.stars*cfg.starPrice;
    a.innerHTML=header()+`<h1>${t("stars")} ⭐</h1>${recipient()}<div class="hero">⭐</div>
    <div class="orbit"><button class="rb l" onclick="stepS(-1)">−</button><div class="num">${S.stars}</div><div class="unit">STARS</div><button class="rb r" onclick="stepS(1)">+</button></div>
    <div class="price">${fmt(sum)} so'm <small>${fmt(cfg.starPrice)} ${t("perStar")}</small></div>
    <div class="chips">${cfg.starPresets.map(n=>`<button class="chip ${n===S.stars?'sel':''}" onclick="S.stars=${n};render()">${fmt(n)}</button>`).join("")}</div>
    ${payBlock()}<button class="buy" onclick="buy('Stars ${S.stars}',${sum})">${t("buyStars")} · ${fmt(sum)} so'm</button>`;
  }
  if(view==="gift"){
    const g=cfg.gifts[S.gift];
    a.innerHTML=header()+`<h1>${t("gift")}</h1>${recipient()}<div class="giftbox">${g?g.e:'🎁'}</div>
    <div style="text-align:center;color:var(--mut);font-size:22px;font-weight:600">${g?fmt(g.price)+" so'm":t("chooseGift")}</div>
    <div class="gifts" style="margin-top:20px">${cfg.gifts.map((x,i)=>`<div class="gift ${i===S.gift?'sel':''}" onclick="S.gift=${i};render()"><div class="e">${x.e}</div>${x.old?`<s>${fmt(x.old)}</s>`:'<s>&nbsp;</s>'}<b>${fmt(x.price)} so'm</b></div>`).join("")}</div>
    ${payBlock()}<button class="buy" ${g?'':'disabled'} onclick="buy('Gift ${g?g.e:''}',${g?g.price:0})">${t("buyGift")}${g?' · '+fmt(g.price)+" so'm":''}</button>`;
  }
  if(view==="profile"){
    const my=orders.filter(o=>o.user===user.username);
    a.innerHTML=header()+`<div class="avatar">${esc(user.name[0].toUpperCase())}</div><div class="pname">${esc(user.name)}</div><div class="puser">${esc(user.username)}</div>
    <div class="balcard" style="cursor:default"><div><small>${t("balance")}</small><b>${fmt(user.balance)} so'm</b></div><button class="tp" onclick="openTopup()">＋ ${t("topup")}</button></div>
    <div class="section">${t("language")}</div>
    <div class="langrow">${[["uz","O'zbekcha"],["ru","Русский"],["en","English"]].map(l=>`<button class="pill ${lang===l[0]?'on':''}" onclick="setLang('${l[0]}')">${l[1]}</button>`).join("")}</div>
    <div class="section">${t("myOrders")}</div>
    ${my.length?my.slice(0,20).map(orderCard).join(""):`<div style="color:var(--mut)">${t("noOrders")}</div>`}
    <br><button class="btn red" style="width:100%" onclick="logout()">${t("logout")}</button>`;
  }
  anim(a,view);
}
function orderCard(o){ return `<div class="ord"><b>${esc(o.item)}</b> — ${fmt(o.sum)} so'm<br>👤 ${esc(o.who)} · ${PM[o.pay]?PM[o.pay][0]:''} ${esc(o.pay)}<br>🕒 ${esc(o.t)} · <span class="st ${o.status}">${t("s_"+o.status)}</span></div>`; }
function go(v){ view=v; render(); scrollTo(0,0); }
function stepP(d){ S.pi=(S.pi+d+cfg.premium.length)%cfg.premium.length; render(); }
function stepS(d){ const arr=cfg.starPresets,i=arr.indexOf(S.stars); S.stars=i>=0?arr[Math.min(arr.length-1,Math.max(0,i+d))]:Math.max(cfg.starMin,S.stars+d*25); render(); }
function logout(){ user=null; localStorage.removeItem(UKEY); view="home"; lastView=null; toast(t("loggedOut")); render(); }

/* ---------------- orders & payment ---------------- */
function addOrder(o){ orders.unshift(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:new Date().toLocaleString(),status:"pending",user:user.username},o)); saveOrders(); }
function buy(item,sum){
  const who=S.self?user.username:S.who.trim();
  if(!who){ const w=$("#who"); if(w){w.classList.add("err");w.focus();} return toast(t("needUser")); }
  if(!S.pay) return;
  if(S.pay==="balans"){
    if(user.balance<sum) return toast(t("insufficient"));
    user.balance-=sum; saveUser(); addOrder({item,sum,who,pay:"balans",type:"buy"});
    toast(t("orderOk")); confetti(); render(); return;
  }
  payModal({method:S.pay,sum,item,who,type:"buy"});
}
let payTimer=null, curPay=null;
function closeM(){ clearInterval(payTimer); $("#modal").innerHTML=""; }
function payModal(o){
  curPay=o; const r=cfg.req[o.method]||{number:"",holder:""}, ok=String(r.number).trim().length>0;
  let left=Math.max(1,+cfg.timer||5)*60; const label=pmName(o.method);
  const fm=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  $("#modal").innerHTML=`<div class="modal"><div class="sheet pay-sheet"><div class="grab"></div>
   <h2><span>${t("payVia").replace("{m}",esc(label))}</span><span class="timer" id="tm">${fm(left)}</span></h2>
   <div class="paycard"><div class="pc-brand">${esc(cfg.name)}</div><div class="pc-sum">${fmt(o.sum)} <small>so'm</small></div>
    <div class="pc-num">${ok?esc(fmtCard(r.number)):'—'}</div><div class="pc-holder">${esc(r.holder||"")}</div></div>
   ${ok?'':`<div class="warn">${t("noReq")}</div>`}
   <div class="two"><button class="cp" onclick="copyTxt('n')">⧉ ${t("copyCard")}</button><button class="cp" onclick="copyTxt('s')">⧉ ${t("copySum")}</button></div>
   <button class="paid" ${ok?'':'disabled'} onclick="paidDone()">${t("paid")}</button>
   <button class="cancel" onclick="closeM()">${t("cancel")}</button></div></div>`;
  clearInterval(payTimer);
  payTimer=setInterval(()=>{ left--; if(left<=0){ closeM(); toast(t("expired")); return; } const e=$("#tm"); if(e){ e.textContent=fm(left); e.classList.toggle("low",left<=30); } },1000);
}
function copyTxt(w){
  const r=cfg.req[curPay.method]||{}, v=w==="n"?String(r.number).replace(/\s/g,""):String(curPay.sum);
  const done=()=>toast(t("copied"));
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done,()=>fallbackCopy(v,done)); else fallbackCopy(v,done);
}
function fallbackCopy(v,done){ const x=document.createElement("textarea"); x.value=v; document.body.appendChild(x); x.select(); try{document.execCommand("copy")}catch(e){} x.remove(); done(); }
function paidDone(){
  const o=curPay; closeM();
  addOrder({item:o.item,sum:o.sum,who:o.who||user.username,pay:o.method,type:o.type});
  toast(t("orderOk")); confetti(); render();
}
function openTopup(){
  const ms=["karta","click","uzumcard"].filter(m=>cfg.pay[m]); window._tp={amount:50000,method:ms[0]||""};
  drawTopup();
}
function drawTopup(){
  const ms=["karta","click","uzumcard"].filter(m=>cfg.pay[m]), T=window._tp;
  $("#modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><h2>💰 ${t("topupTitle")}<button class="icon-btn" onclick="closeM()">✕</button></h2>
   <div class="f"><label>${t("amount")}</label><input type="number" id="tp_a" value="${T.amount}" oninput="_tp.amount=+this.value" style="width:100%;background:#131b29;border:1px solid var(--line);color:#fff;border-radius:16px;padding:16px;font-size:20px"></div>
   <div class="chips" style="margin-bottom:14px">${[10000,50000,100000,200000].map(n=>`<button class="chip" style="font-size:15px" onclick="_tp.amount=${n};$('#tp_a').value=${n}">${fmt(n)}</button>`).join("")}</div>
   <div class="f"><label>${t("method")}</label></div>
   <div class="chips">${ms.map(m=>`<button class="chip ${T.method===m?'sel':''}" style="font-size:16px" onclick="_tp.method='${m}';drawTopup()">${PM[m][0]} ${pmName(m)}</button>`).join("")}</div>
   <button class="buy" onclick="topupGo()">${t("cont")}</button></div></div>`;
}
function topupGo(){
  const T=window._tp; if(!T.method) return; if(!(T.amount>=1000)) return toast(t("minTop"));
  payModal({method:T.method,sum:T.amount,item:t("topupTitle"),who:user.username,type:"topup"});
}

   <button class="btn gray" onclick="cfg.gifts.push({e:'🎁',price:0,old:0});save();openAdmin()">+ Добавить подарок</button>`;
  if(adminTab==="pay") b=Object.keys(PM).map(k=>`<div class="sw"><span>${PM[k][0]} ${PM[k][1]}</span><input type="checkbox" ${cfg.pay[k]?'checked':''} onchange="cfg.pay['${k}']=this.checked;save()"></div>`).join("");
  if(adminTab==="req") b=`<div class="f"><label>Время на оплату (минут)</label><input type="number" value="${cfg.timer}" onchange="cfg.timer=+this.value||5;save()"></div>`+
   ["karta","click","uzumcard"].map(k=>`<div class="section" style="margin:16px 0 8px">${PM[k][0]} ${PM[k][1]}</div>
   <div class="f"><label>Номер карты / телефона</label><input type="text" value="${esc(cfg.req[k].number)}" placeholder="0000 0000 0000 0000" onchange="cfg.req['${k}'].number=this.value.trim();save()"></div>
   <div class="f"><label>Имя владельца</label><input type="text" value="${esc(cfg.req[k].holder)}" placeholder="FAMILIYA ISM" onchange="cfg.req['${k}'].holder=this.value;save()"></div>`).join("")+
   `<div style="color:var(--mut);font-size:13px">Эти данные видят клиенты в окне оплаты. Пока номер пуст, кнопка «Я оплатил» заблокирована.</div>`;
  if(adminTab==="orders") b=ordersAdmin();
  if(adminTab==="deliv") b=delivAdmin();
  if(adminTab==="sec") b=`<div class="f"><label>Новый пароль</label><input type="password" id="np"></div><button class="btn" onclick="changePass()">Сменить пароль</button><br><br>
   <button class="btn gray" onclick="sessionStorage.removeItem('uzpay_admin');closeM();toast('OK')">Выйти из админки</button>`;
  $("#modal").innerHTML=`<div class="modal" onclick="if(event.target===this){closeM();render()}"><div class="sheet"><h2>⚙️ Admin panel <button class="icon-btn" onclick="closeM();render()">✕</button></h2>
   <div class="tabs">${T.map(x=>`<button class="tab ${adminTab===x[0]?'sel':''}" onclick="adminTab='${x[0]}';openAdmin()">${x[1]}</button>`).join("")}</div>${b}</div></div>`;
}
function ordersAdmin(){
  if(!orders.length) return '<div style="color:var(--mut)">Заказов нет</div>';
  const lab={pending:"⏳ ожидает",done:"✅ одобрен и выдан",canceled:"❌ отклонён"};
  return orders.map((o,i)=>`<div class="ord"><b>${esc(o.item)}</b> — ${fmt(o.sum)} so'm<br>👤 ${esc(o.who)} (${esc(o.user||"")}) · ${esc(o.pay)} · ${o.type==="topup"?"пополнение":"покупка"}<br>🕒 ${esc(o.t)}<br><span class="st ${o.status}">${lab[o.status]||o.status}</span>${o.deliveryError?' <span class="st canceled">ошибка выдачи</span>':''}${o.status==="pending"?`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="flex:1;background:#17803f" onclick="approveOrder(${i},this)">✅ Одобрить</button><button class="btn red" style="flex:1" onclick="rejectOrder(${i})">❌ Отклонить</button></div>`:""}</div>`).join("")
   +`<br><button class="btn red" onclick="if(confirm('Очистить все заказы?')){orders=[];saveOrders();openAdmin()}">Очистить</button>`
   +`<div style="color:var(--mut);font-size:12px;margin-top:10px;line-height:1.5">«Одобрить» ${cfg.webhook?"отправляет заказ на ваш сервер выдачи и ставит статус «выдан».":"ставит статус «выдан». Чтобы выдача Premium/Stars/Gift шла автоматически, укажите сервер на вкладке «Выдача»."} Для пополнения сумма сразу зачисляется на баланс (для пользователя этого устройства). При отклонении оплата с баланса возвращается.</div>`;
}
function delivAdmin(){
  return `<div class="f"><label>URL сервера выдачи (webhook)</label><input type="text" value="${esc(cfg.webhook||"")}" placeholder="https://your-server.com/api/deliver" onchange="cfg.webhook=this.value.trim();save();toast('OK ✅')"></div>
  <div class="f"><label>Секретный ключ (тот же, что SECRET на сервере)</label><input type="password" value="${esc(cfg.webhookSecret||"")}" placeholder="длинный секретный ключ" onchange="cfg.webhookSecret=this.value.trim();save();toast('OK ✅')"></div>
  <div style="color:var(--mut);font-size:13px;line-height:1.6">При нажатии «Одобрить» страница отправит на этот адрес POST (JSON):<br><code style="color:#9cd0ff">{event:"order.approved", order:{id,item,sum,recipient,payment,buyer,time}}</code><br><br>Ваш сервер должен реально выдать Premium/Stars/Gift получателю (через Telegram API или поставщика) и ответить кодом 200. Если ответ не 200 или сервер недоступен, заказ останется «ожидает» с пометкой «ошибка выдачи», и его можно одобрить повторно.<br><br>Сервер должен разрешать CORS для этой страницы. Без URL «Одобрить» только меняет статус.</div>`;
}
async function approveOrder(i,btn){
  const o=orders[i]; if(!o||o.status!=="pending") return;
  if(o.type==="buy"&&cfg.webhook){
    if(btn){ btn.disabled=true; btn.textContent="⏳ Выдача..."; }
    try{
      const r=await fetch(cfg.webhook,{method:"POST",headers:{"Content-Type":"application/json","X-Secret":cfg.webhookSecret||""},body:JSON.stringify({event:"order.approved",order:{id:o.id,item:o.item,sum:o.sum,recipient:o.who,payment:o.pay,buyer:o.user,time:o.t}})});
      if(!r.ok) throw new Error(r.status);
    }catch(e){ o.deliveryError=true; saveOrders(); toast("Не удалось выдать: сервер не ответил"); openAdmin(); return; }
  }
  o.status="done"; delete o.deliveryError; o.deliveredAt=new Date().toLocaleString();
  if(o.type==="topup"&&!o.credited&&user&&o.user===user.username){ user.balance+=o.sum; o.credited=true; saveUser(); }
  saveOrders(); toast("✅ Заказ одобрен"+(o.type==="buy"&&cfg.webhook?" и выдан":"")); openAdmin();
}
function rejectOrder(i){
  const o=orders[i]; if(!o||o.status!=="pending") return; if(!confirm("Отклонить заказ?")) return;
  o.status="canceled";
  if(o.pay==="balans"&&!o.refunded&&user&&o.user===user.username){ user.balance+=o.sum; o.refunded=true; saveUser(); }
  saveOrders(); toast("Заказ отклонён"); openAdmin();
}
function notifyDone(){
  if(!user) return; let n=0;
  orders.forEach(o=>{ if(o.user===user.username&&o.status==="done"&&!o.seen){ o.seen=true; n++; } });
  if(n){ saveOrders(); setTimeout(()=>{ toast(t("orderDone")); confetti(); },300); }
}
window.addEventListener("storage",e=>{
  if(e.key===OKEY||e.key===UKEY){ try{ orders=JSON.parse(localStorage.getItem(OKEY)||"[]"); user=JSON.parse(localStorage.getItem(UKEY)||"null"); }catch(x){} if(!$(".modal")) render(); }
});
function saveGeneral(){ cfg.name=$("#g_name").value||"UzPay"; cfg.accent=$("#g_acc").value; cfg.maintenance=$("#g_mt").checked;
  if(user&&$("#g_bal")){ user.balance=+$("#g_bal").value||0; saveUser(); } save(); document.title=cfg.name; toast("OK ✅"); }
function saveStars(){ cfg.starPrice=+$("#s_p").value; cfg.starMin=+$("#s_m").value; cfg.starPresets=$("#s_l").value.split(",").map(x=>+x.trim()).filter(x=>x>0); S.stars=cfg.starPresets[0]||cfg.starMin; save(); toast("OK ✅"); }
function changePass(){ const v=$("#np").value; if(v.length<6) return toast("Минимум 6 символов"); localStorage.setItem("uzpay_pass",v); toast("Пароль изменён ✅"); }
function resetAll(){ if(confirm("Сбросить все настройки?")){ cfg=structuredClone(DEFAULT); save(); openAdmin(); } }

/* ---------------- animation helpers ---------------- */
let lastView=null, lastNum=null, lastGift=null;
function anim(a,key){
  if(key!==lastView){ a.classList.remove("enter"); void a.offsetWidth; a.classList.add("enter"); lastView=key; lastNum=null; lastGift=null; }
  else a.classList.remove("enter");
  const n=$(".num");
  if(n){ if(lastNum!==null&&n.textContent!==lastNum){ n.classList.add("pop"); const p=$(".price"); p&&p.classList.add("pop"); } lastNum=n.textContent; }
  const gb=$(".giftbox"); if(gb){ if(lastGift!==null&&lastGift!==S.gift) gb.classList.add("pop"); lastGift=S.gift; }
}
document.addEventListener("click",e=>{
  const x=e.target.closest(".buy,.btn,.pill,.chip,.pm,.gift,.mcard,.tab,.cp,.paid");
  if(!x) return; const r=x.getBoundingClientRect(), d=document.createElement("span");
  d.className="rip"; d.style.left=(e.clientX-r.left)+"px"; d.style.top=(e.clientY-r.top)+"px";
  x.style.overflow="hidden"; x.appendChild(d); setTimeout(()=>d.remove(),650);
},true);
function confetti(){
  const colors=["#5aa9ee","#fff","#ffd166","#ef476f","#06d6a0","#9b5de5"];
  for(let i=0;i<60;i++){ const c=document.createElement("i"); c.className="cf"; c.style.left=Math.random()*100+"vw"; c.style.background=colors[i%6]; c.style.borderRadius=Math.random()>.5?"50%":"2px"; document.body.appendChild(c);
    c.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${(Math.random()-.5)*200}px,105vh) rotate(${Math.random()*900}deg)`,opacity:.8}],{duration:1400+Math.random()*1400,easing:"cubic-bezier(.3,.5,.5,1)",delay:Math.random()*300}).onfinish=()=>c.remove(); }
}

save(); document.title=cfg.name; document.documentElement.lang=lang; render();
</script>
</body>
</html>
